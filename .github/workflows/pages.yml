name: Pool status update

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

  schedule:
    - cron: "15 3 * * *"
      timezone: "Europe/Prague"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate configuration and regression tests
        run: |
          python scripts/check_links.py
          python -m unittest discover -s tests
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Update pool data
        run: python scripts/update_data.py

      - name: Validate generated data
        run: |
          python scripts/check_links.py --data data/pools.json
          DATA_FILE=data/pools.json npm test

      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html app.js style.css robots.txt _site/
          cp data/pools.json _site/data/

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed page
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  external-links:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Report external availability
        run: python scripts/check_availability.py
      - uses: actions/upload-artifact@v4
        with:
          name: link-availability
          path: link-availability.json
