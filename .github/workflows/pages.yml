name: Pool status update

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Prague"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      generated_at: ${{ steps.data.outputs.generated_at }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate configuration and regression tests
        run: |
          python scripts/check_links.py
          python -m unittest discover -s tests
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Generate candidate pool data
        run: python scripts/update_data.py --output .tmp/pools.candidate.json

      - name: Validate generated data
        run: |
          python scripts/check_links.py --require-live --data .tmp/pools.candidate.json
          DATA_FILE=.tmp/pools.candidate.json npm test

      - name: Accept validated snapshot
        id: data
        run: |
          mv .tmp/pools.candidate.json data/pools.json
          python -c 'import json, os; from pathlib import Path; data = json.loads(Path("data/pools.json").read_text()); Path(os.environ["GITHUB_OUTPUT"]).open("a").write("generated_at=" + data["generated_at"] + "\n")'

      - name: Commit updated pool data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: commit
        run: |
          git add -- data/pools.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh daily pool data'
            git push origin HEAD:main
          fi

      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html app.js style.css robots.txt _site/
          cp data/pools.json _site/data/

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    # GITHUB_TOKEN commits do not trigger another push workflow. Deploy the
    # validated/committed snapshot in this same run instead.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed page
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_GENERATED_AT: ${{ needs.build.outputs.generated_at }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  external-links:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Report external availability
        run: python scripts/check_availability.py
      - uses: actions/upload-artifact@v4
        with:
          name: link-availability
          path: link-availability.json
