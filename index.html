<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f8">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>Přehled</title>
  <link rel="stylesheet" href="./style.css?v=20261016-3">
</head>
<body>
  <main class="wrap">
    <header>
      <div class="header-copy">
        <p class="eyebrow">PŘEHLED</p>
        <h1 id="page-title">Kde si dnes zaplavat?</h1>
        <p class="lead">Časy pro veřejnost, počet a délka drah na jednom místě.</p>
      </div>
      <button id="reload" class="button" type="button">Načíst znovu</button>
    </header>

    <nav class="tabs" role="tablist" aria-label="Den">
      <button id="tab-today" class="tab active" type="button" role="tab" aria-selected="true">Dnes</button>
      <button id="tab-tomorrow" class="tab" type="button" role="tab" aria-selected="false">Zítra</button>
    </nav>

    <section class="summary" id="summary" aria-label="Souhrn"></section>

    <section class="grid" id="grid" aria-live="polite" aria-busy="true">
      <article class="card" id="boot-message">
        <b>Načítám data bazénů…</b>
        <p class="note">Pokud tato zpráva zůstane na obrazovce, nebyl načten soubor app.js.</p>
      </article>
    </section>

    <noscript>
      <article class="card">
        <b>JavaScript je vypnutý.</b>
        <p class="note">Pro zobrazení aktuálních údajů je potřeba povolit JavaScript.</p>
      </article>
    </noscript>

    <footer>
      <span id="updated"></span>
      <span class="footer-separator" aria-hidden="true">•</span>
      <span>Neznámé údaje raději nezobrazujeme jako odhad.</span>
    </footer>
  </main>
  <script src="./app.js?v=20261017-3" defer></script>
</body>
</html>
